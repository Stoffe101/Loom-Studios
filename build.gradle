plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "loom-studios" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            displayName = "Loom Studios - Client"
            runDirectory = file(project.hasProperty("uiCapture") ? "run-ui-capture" : "run")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
            systemProperties.put("fabric.log.level", "debug")
            if (project.hasProperty("uiCapture")) {
                systemProperties.put("loom.uiCapture", "true")
                vmArgs "-Xms256M", "-Xmx1024M"
                if (project.hasProperty("uiCaptureStart")) systemProperties.put("loom.uiCaptureStart", project.property("uiCaptureStart").toString())
                systemProperties.put("fabric.log.level", "info")
            }
        }

        clientA {
            client()
            displayName = "Loom Studios - Client A"
            runDirectory = file("run-client-a")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
            programArgs "--username", "LoomA", "--uuid", "11111111-1111-4111-8111-111111111111"
        }

        clientB {
            client()
            displayName = "Loom Studios - Client B"
            runDirectory = file("run-client-b")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
            programArgs "--username", "LoomB", "--uuid", "22222222-2222-4222-8222-222222222222"
        }

        server {
            server()
            displayName = "Loom Studios - Server"
            runDirectory = file("run-server")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
            programArgs "nogui"
        }
    }

    runs.configureEach {
        generateRunConfig = true
    }
}

// Loom remaps local mod JARs into the named development namespace.
// Some mods (notably 3D Skin Layers) bundle required Fabric libraries as
// META-INF/jars/*.jar. Loom's local-remap path does not reliably expose those
// nested libraries as separate dev-runtime mods, so flatten them into a
// generated directory before resolving modLocalRuntime.
def devModsDir = file("dev-mods")
def nestedDevModsDir = file("${buildDir}/dev-mods-nested")
def nestedDevModFiles = []

nestedDevModsDir.mkdirs()

if (devModsDir.exists()) {
    fileTree(devModsDir) {
        include "*.jar"
    }.files.sort { it.name }.each { sourceJar ->
        def zip = new java.util.zip.ZipFile(sourceJar)
        try {
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.isDirectory()
                        && entry.name.startsWith("META-INF/jars/")
                        && entry.name.endsWith(".jar")) {
                    def sourcePrefix = sourceJar.name.replaceAll("[^A-Za-z0-9._-]", "_")
                    def nestedName = new File(entry.name).name
                    def outputJar = new File(nestedDevModsDir, "${sourcePrefix}__${nestedName}")
                    nestedDevModFiles.add(outputJar)

                    // Avoid deleting/rewriting an embedded library that may already
                    // be open by another development client on Windows.
                    if (!outputJar.exists() || outputJar.length() != entry.size) {
                        zip.getInputStream(entry).withCloseable { input ->
                            outputJar.withOutputStream { output ->
                                input.transferTo(output)
                            }
                        }
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Optional local compatibility mods for runClient.
    // JARs in dev-mods/ are not published or bundled with Loom Studios.
    modLocalRuntime fileTree(dir: devModsDir, include: ["*.jar"])

    // Flattened nested Fabric libraries from local compatibility mods.
    // Generated under build/ and never published.
    modLocalRuntime files(nestedDevModFiles)
}

def modVersion = project.version

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def licenseArchiveName = project.archives_base_name

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

tasks.register("listDevMods") {
    group = "loom studios"
    description = "Lists optional compatibility mods and flattened embedded libraries loaded by the development runtime."

    doLast {
        def jars = fileTree(devModsDir) { include "*.jar" }.files.sort { it.name }
        def nestedJars = nestedDevModFiles.findAll { it.exists() }.sort { it.name }

        if (jars.isEmpty()) {
            println "No optional development mods found in dev-mods/."
        } else {
            println "Optional development mods:"
            jars.each { println " - ${it.name}" }
        }

        if (!nestedJars.isEmpty()) {
            println "Embedded development libraries extracted for Loom remapping:"
            nestedJars.each { println " - ${it.name}" }
        }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
