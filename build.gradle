plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "loom-studios" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            displayName = "Loom Studios - Client"
            runDirectory = file("run")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
            systemProperties.put("fabric.log.level", "debug")
        }

        server {
            server()
            displayName = "Loom Studios - Server"
            runDirectory = file("run-server")
            generateRunConfig = true
            preferGradleTask = true
            ideConfigFolder = "Loom Studios"
        }
    }

    runs.configureEach {
        generateRunConfig = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional local compatibility mods for runClient.
    // JARs in dev-mods/ are not published or bundled with Loom Studios.
    modLocalRuntime fileTree(dir: "dev-mods", include: ["*.jar"])
}

def modVersion = project.version

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def licenseArchiveName = project.archives_base_name

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

tasks.register("listDevMods") {
    group = "loom studios"
    description = "Lists optional compatibility mods loaded by the development runtime."

    doLast {
        def jars = fileTree("dev-mods") { include "*.jar" }.files.sort { it.name }
        if (jars.isEmpty()) {
            println "No optional development mods found in dev-mods/."
        } else {
            println "Optional development mods:"
            jars.each { println " - ${it.name}" }
        }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
