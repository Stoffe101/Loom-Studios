name: Premium renderer comparison
on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/client/java/dev/loomstudios/client/ui/premium/**"
      - "src/client/java/dev/loomstudios/client/screen/LoomPremiumPrototypeScreen.java"
      - ".github/workflows/premium-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare display
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
          mkdir -p run-ui-capture
          rm -f docs/verification/editor-workspace/*.png
          cat > run-ui-capture/options.txt <<'OPTIONS'
          version:4671
          enableVsync:false
          renderDistance:2
          simulationDistance:2
          maxFps:30
          mipmapLevels:0
          tutorialStep:none
          onboardAccessibility:false
          startedCleanly:true
          OPTIONS
      - name: Compare renderers and verify input workflows
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s '-screen 0 3440x1440x24' ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G --max-workers=2 runClient -PuiCapture -PuiCaptureStart=182 | tee premium-capture.log
          test "$(find docs/verification/editor-workspace -name '*.png' | wc -l)" -eq 8
          grep -q 'LOOM_UI_CAPTURE COMPLETE' premium-capture.log
          test "$(grep -c 'LOOM_UI_TEXTURE_CACHE_REUSE PASS' premium-capture.log)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-premium-comparison
          path: |
            docs/verification/editor-workspace/premium-*.png
            premium-capture.log
            run-ui-capture/logs/latest.log
