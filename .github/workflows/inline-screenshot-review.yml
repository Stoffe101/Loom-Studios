name: Publish current CI images for inline review

on:
  push:
    branches: [ci/inline-screenshot-review-2026-10-08]
    paths:
      - .github/workflows/inline-screenshot-review.yml

permissions:
  actions: read
  contents: write

jobs:
  inline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch successful CI artifact packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/loom-ci docs/review-screenshots
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11536067452/zip" > /tmp/loom-ci/asset.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11536641881/zip" > /tmp/loom-ci/animation.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11535267949/zip" > /tmp/loom-ci/layout.zip
      - name: Select the real screenshots without resizing or regenerating
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          sources = {
            "asset": Path("/tmp/loom-ci/asset.zip"),
            "animation": Path("/tmp/loom-ci/animation.zip"),
            "layout": Path("/tmp/loom-ci/layout.zip"),
          }
          patterns = [
            ("asset", "asset-library-edit-cape-1920x1080-gui3.png", "asset-inspector-1920-gui3.png"),
            ("asset", "asset-library-edit-cape-3440x1440-gui2.png", "asset-inspector-ultrawide-gui2.png"),
            ("asset", "asset-library-cape-worn-1920x1080-gui3.png", "cape-worn-1920-gui3.png"),
            ("asset", "asset-library-elytra-worn-3440x1440-gui2.png", "elytra-worn-ultrawide-gui2.png"),
            ("animation", "animation-simple-cape-1920x1080-gui3.png", "simple-animation-1920-gui3.png"),
            ("animation", "animation-simple-cape-3440x1440-gui2.png", "simple-animation-ultrawide-gui2.png"),
            
          ]
          out=Path("docs/review-screenshots")
          for name,zippath in sources.items():
            with zipfile.ZipFile(zippath) as z:
              names=[n for n in z.namelist() if n.lower().endswith(".png")]
              print(f"{name} contains {len(names)} PNG images:",names[:8])
              for origin, requested, alias in [p for p in patterns if p[0]==name]:
                exact=next((n for n in names if Path(n).name == requested),None)
                if exact is None:
                  token = requested.split("-1920")[0].split("-3440")[0]
                  matches=[n for n in names if token in Path(n).name]
                  print("Missing",requested,"candidates",matches[:12])
                  continue
                content=z.read(exact)
                if not content.startswith(bytes([137,80,78,71,13,10,26,10])):
                  raise ValueError("Not an original PNG: "+exact)
                (out/alias).write_bytes(content)
                print("SELECTED",alias,len(content))
          # Layout capture names differ from the main editor filename convention.
          with zipfile.ZipFile(sources["layout"]) as z:
              layout=[n for n in z.namelist() if n.lower().endswith(".png")]
              print("LAYOUT IMAGE NAMES",layout[:35])
              for surface in ("cape","elytra"):
                  choices=[n for n in layout if surface in Path(n).name.lower()
                      and ("gui3" in Path(n).name.lower() or "compact" in Path(n).name.lower())]
                  if choices:
                      dest=out/f"panel-resize-{surface}-gui3.png"
                      dest.write_bytes(z.read(choices[0]))
                      print("SELECTED LAYOUT",dest,choices[0])
          files=list(out.glob("*.png"))
          print("PUBLISHED",len(files),"original PNG screenshots")
          if len(files)<4:
            raise ValueError("Not enough original screenshots to review")
          PY
      - name: Make lightweight inline image previews
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path("docs/review-screenshots").glob("*.png")):
              with Image.open(path) as original:
                  im=original.convert("RGB")
                  im.thumbnail((1440,900))
                  dest=path.with_suffix(".jpg")
                  im.save(dest,format="JPEG",quality=80,optimize=True,progressive=True)
                  print("INLINE", dest, dest.stat().st_size)
          PY
      - name: Commit review images only on dedicated temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-screenshots/
          git commit -m "ci(review): provide actual PNGs from successful UI runs" || exit 0
          git push
