name: Simple Animation visual review

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/client/java/dev/loomstudios/client/screen/LoomAnimationScreen.java"
      - "src/client/java/dev/loomstudios/client/ui/LoomAnimationPresetGallery.java"
      - "src/client/java/dev/loomstudios/client/debug/LoomUiCapture.java"
      - "src/main/java/dev/loomstudios/project/AnimationPresetDraft.java"
      - ".github/workflows/animation-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animation-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simple-animation-review:
    name: Real Simple Animation UI in four GUI profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Minecraft software-rendering requirements
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 python3-pil
          mkdir -p run-ui-capture
          rm -f docs/verification/editor-workspace/animation-simple-*.png
          cat > run-ui-capture/options.txt <<'OPTIONS'
          version:4671
          enableVsync:false
          renderDistance:2
          simulationDistance:2
          maxFps:30
          mipmapLevels:0
          tutorialStep:none
          onboardAccessibility:false
          startedCleanly:true
          OPTIONS
      - name: Capture four real Minecraft Simple Animation views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s '-screen 0 3440x1440x24' ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G --max-workers=2 runClient -PuiCapture -PuiCaptureStart=330 -PuiCaptureEnd=334 | tee animation-review.log
          test "$(find docs/verification/editor-workspace -name 'animation-simple-*.png' | wc -l)" -eq 4
          grep -q 'LOOM_UI_CAPTURE COMPLETE' animation-review.log
      - name: Build original image review package and contact sheet
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil
          source=Path('docs/verification/editor-workspace')
          files=sorted(source.glob('animation-simple-*.png'))
          out=Path('build/animation-review')
          out.mkdir(parents=True,exist_ok=True)
          sheet=Image.new('RGB',(1600,1000),'#0D1620')
          draw=ImageDraw.Draw(sheet)
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB')
              im.load()
              shutil.copy2(p,out/p.name)
              im.thumbnail((780,460))
              x=(i%2)*800;y=(i//2)*500
              sheet.paste(im,(x,y+28))
              draw.text((x+8,y+8),p.stem,fill='white')
          sheet.save(out/'animation-simple-contact-sheet.jpg',quality=90)
          print('LOOM_ANIMATION_REVIEW',len(files),'real Minecraft screenshots decoded')
          assert len(files)==4,'Missing required animation capture'
          PY
      - name: Upload original screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-simple-animation-review
          retention-days: 7
          path: |
            build/animation-review/
            animation-review.log
            run-ui-capture/crash-reports/*.txt
