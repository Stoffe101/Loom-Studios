name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Minecraft 1.21.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wrapper info
        run: ./gradlew --version

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-studios-dev
          path: build/libs/*.jar
          if-no-files-found: error
