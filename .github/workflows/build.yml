name: Build

# Prevent queues of obsolete PR captures from consuming storage and runner hours.
# Main-branch verification is never canceled by a later pull request.
concurrency:
  group: loom-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Minecraft 1.21.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wrapper info
        run: ./gradlew --version

      - name: Build
        run: |
          ./gradlew --no-daemon build
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob('build/test-results/test/TEST-*.xml')
          assert reports, 'No test reports'
          totals = {name: 0 for name in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              root = ET.parse(report).getroot()
              for name in totals: totals[name] += int(root.get(name, 0))
          print('LOOM_TEST_REPORT ' + ' '.join(f'{name}={value}' for name, value in totals.items()))
          assert totals['failures'] == totals['errors'] == 0
          PYTEST

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-studios-dev
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  editor-capture:
    name: Real editor screenshots / Mesa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 python3-pil
      - name: Prepare isolated capture client
        run: |
          mkdir -p run-ui-capture
          rm -f docs/verification/editor-workspace/*.png
          cat > run-ui-capture/options.txt <<'OPTIONS'
          version:4671
          enableVsync:false
          renderDistance:2
          simulationDistance:2
          maxFps:30
          mipmapLevels:0
          tutorialStep:none
          onboardAccessibility:false
          startedCleanly:true
          OPTIONS
      - name: Capture actual editor profiles
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s '-screen 0 3440x1440x24' ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1G --max-workers=2 runClient -PuiCapture | tee capture.log
          test "$(find docs/verification/editor-workspace -name '*.png' | wc -l)" -eq 334
          grep -q 'LOOM_UI_CAPTURE COMPLETE' capture.log
      - name: Build compact visual review package
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil
          src = Path("docs/verification/editor-workspace")
          dst = Path("build/loom-review-shots")
          dst.mkdir(parents=True, exist_ok=True)
          families = ("creative-", "cape-", "elytra-", "smart-import-", "home-", "codes-", "authoring-", "asset-library-")
          # Keep actual GUI3 compact and GUI2 ultrawide examples, not 310 redundant PNGs.
          files = [p for p in src.glob("*.png") if p.name.startswith(families)
                   and (p.name.startswith("asset-library-")
                        or "-1920x1080-gui3" in p.name
                        or "-3440x1440-gui2" in p.name)]
          # Curate for human review, not alphabetical order: all sixteen new
          # Asset Library profiles, then animation/curves, then familiar editors.
          focused = ("asset-library-", "creative-", "cape-animation-", "elytra-animation-",
                     "cape-1920", "elytra-3440", "home-1920", "smart-import-", "authoring-")
          files = [p for p in files if p.name.startswith(focused)]
          files.sort(key=lambda p: (
              next((i for i, prefix in enumerate(focused) if p.name.startswith(prefix)), 99),
              p.name))
          # All captures were run and asserted above. The artifact contains the
          # specific new screens first, preserving useful evidence under a size cap.
          for p in files[:55]:
              shutil.copy2(p, dst / p.name)
          # Contact sheet is a quick review index. Original PNGs remain in artifact.
          thumbs = sorted(dst.glob("*.png"))
          if thumbs:
              sheet = Image.new("RGB", (1600, ((len(thumbs) + 3) // 4) * 290), "#09111d")
              draw = ImageDraw.Draw(sheet)
              for i, p in enumerate(thumbs):
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((390, 250))
                  x = (i % 4) * 400
                  y = (i // 4) * 290
                  sheet.paste(im, (x, y + 27))
                  draw.text((x + 6, y + 6), p.stem[:48], fill="white")
              sheet.save(dst / "review-contact-sheet.jpg", quality=84)
          print(f"LOOM_REVIEW_PACKAGE selected={len(thumbs)} original_pngs={len(list(src.glob('*.png')))}")
          PY
      - name: Upload selected real-client screenshots and review index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-editor-screenshots
          retention-days: 7
          path: |
            build/loom-review-shots/
            run-ui-capture/logs/latest.log
            run-ui-capture/crash-reports/*.txt
            capture.log
